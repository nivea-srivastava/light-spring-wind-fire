<!doctype html>
<html><head><style>

  .tile{background:#fff;padding:4px;}
  .label{font:12px sans-serif;color:#333;margin-top:4px;}
</style></head>
<body>
  <div class="row">
    <div><div class="tile"><img src="favicon.svg" width="16" height="16"></div><div class="label">16</div></div>

    <div><div class="tile"><img src="favicon.svg" width="64" height="64"></div><div class="label">64</div></div>
    <div><div class="tile" style="background:#222"><img src="favicon.svg" width="16" height="16"></div><div class="label">16 on dark</div></div>
  </div>
</body></html>
